<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tip</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: {{primary}};
    --secondary: {{secondary}};
    --accent: {{accent}};
    --ink: {{ink}};
    --font: {{font}}, "Inter", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink);
    background: var(--primary); position: relative;
  }

  /* Tip layout: solid ground, one big accent panel on the right edge, text on the left. */
  .panel {
    position: absolute; right: -260px; top: -120px; width: 720px; height: 1320px;
    background: var(--accent); opacity: .14; transform: rotate(12deg); border-radius: 80px;
  }
  .stripe {
    position: absolute; left: 80px; top: 372px; width: 14px; height: 300px;
    background: var(--accent); border-radius: 7px;
  }

  .card { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .logo span { font-weight: 800; font-size: 30px; color: var(--primary); }
  .brand-name { font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
  .handle { font-weight: 500; font-size: 26px; opacity: .8; }

  .middle { display: flex; flex-direction: column; gap: 30px; padding-left: 44px; }
  .eyebrow {
    align-self: flex-start; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--primary); background: var(--accent); padding: 12px 22px; border-radius: 999px;
  }
  .headline {
    font-size: 92px; line-height: 1.04; font-weight: 800; letter-spacing: -.03em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    max-height: 192px; text-wrap: balance;
  }
  .body {
    font-size: 36px; line-height: 1.35; font-weight: 500; opacity: .9; max-width: 820px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .cta { font-size: 30px; font-weight: 700; padding: 22px 40px; border-radius: 999px; background: var(--accent); color: var(--primary); box-shadow: 0 12px 30px rgba(0,0,0,.22); }
  .cta:empty { display: none; }
  .footer { font-size: 26px; font-weight: 500; opacity: .8; }
</style>
</head>
<body>
  <div class="panel"></div>
  <div class="stripe"></div>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="logo">{{logo_html}}</div>
        <div class="brand-name">{{brand_name}}</div>
      </div>
      <div class="handle">{{handle}}</div>
    </div>
    <div class="middle">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1 class="headline">{{headline}}</h1>
      <p class="body">{{body}}</p>
    </div>
    <div class="bottom">
      <div class="cta">{{cta}}</div>
      <div class="footer">{{footer}}</div>
    </div>
  </div>
</body>
</html>
