<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>announcement</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Brand kit. Every value here comes from the brand_kits table. */
  :root {
    --primary: #0F172A;
    --secondary: #1E3A8A;
    --accent: #38BDF8;
    --ink: #FFFFFF;
    --font: Inter, "Inter", "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(150deg, var(--primary) 0%, var(--secondary) 100%);
    position: relative;
  }

  /* Soft decorative shapes. Kept behind the text panel so copy always sits on a calm surface. */
  .blob {
    position: absolute; border-radius: 50%; filter: blur(2px); opacity: .35;
    background: var(--accent);
  }
  .blob.a { width: 560px; height: 560px; right: -180px; top: -200px; }
  .blob.b { width: 320px; height: 320px; left: -120px; bottom: 80px; opacity: .22; }
  .grid {
    position: absolute; inset: 0; opacity: .08;
    background-image:
      linear-gradient(var(--ink) 1px, transparent 1px),
      linear-gradient(90deg, var(--ink) 1px, transparent 1px);
    background-size: 72px 72px;
  }

  .card {
    position: absolute; inset: 0;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Top bar: logo and handle, always same position across every template. */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px;
    background: #fff; display: grid; place-items: center; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .logo span { font-weight: 800; font-size: 30px; color: var(--primary); }
  .brand-name { font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
  .handle { font-weight: 500; font-size: 26px; opacity: .8; }

  /* Middle: eyebrow, headline, body. Headline is clamped to two lines at a fixed size. */
  .middle { display: flex; flex-direction: column; gap: 30px; }
  .eyebrow {
    align-self: flex-start;
    font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35);
  }
  .headline {
    font-size: 96px; line-height: 1.04; font-weight: 800; letter-spacing: -.03em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    max-height: 200px;
    text-wrap: balance;
  }
  .body {
    font-size: 36px; line-height: 1.35; font-weight: 500; opacity: .92;
    max-width: 860px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Bottom: CTA pill and footer link. */
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .cta {
    font-size: 30px; font-weight: 700;
    padding: 22px 40px; border-radius: 999px;
    background: var(--ink); color: var(--primary);
    box-shadow: 0 12px 30px rgba(0,0,0,.22);
  }
  .footer { font-size: 26px; font-weight: 500; opacity: .8; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="logo"><span>U</span></div>
        <div class="brand-name">Upgrowth</div>
      </div>
      <div class="handle">@upgrowth.io</div>
    </div>

    <div class="middle">
      <div class="eyebrow">Swipe</div>
      <h1 class="headline">Justify SEO spend in 3 numbers</h1>
      <p class="body">A quick way to turn a ranking lift into a revenue projection.</p>
    </div>

    <div class="bottom">
      <div class="cta">Try it free</div>
      <div class="footer">upgrowth.io</div>
    </div>
  </div>
</body>
</html>
