<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quote</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0F172A;
    --secondary: #1E3A8A;
    --accent: #38BDF8;
    --ink: #FFFFFF;
    --font: Inter, "Inter", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink);
    background: radial-gradient(1200px 900px at 20% 110%, var(--secondary) 0%, var(--primary) 60%);
    position: relative;
  }

  /* Quote layout: centred text, oversized quotation mark in accent, thin rule before attribution. */
  .mark {
    position: absolute; left: 56px; top: 110px;
    font-size: 420px; line-height: 1; font-weight: 800; color: var(--accent); opacity: .22;
    font-family: Georgia, "Times New Roman", serif;
  }

  .card { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .logo span { font-weight: 800; font-size: 30px; color: var(--primary); }
  .brand-name { font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
  .handle { font-weight: 500; font-size: 26px; opacity: .8; }

  .middle { display: flex; flex-direction: column; gap: 36px; padding: 0 20px; }
  .headline {
    font-size: 72px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    max-height: 340px; text-wrap: balance;
  }
  .rule { width: 96px; height: 6px; background: var(--accent); border-radius: 3px; }
  .body {
    font-size: 32px; line-height: 1.35; font-weight: 500; opacity: .85; max-width: 820px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .cta { font-size: 30px; font-weight: 700; padding: 22px 40px; border-radius: 999px; background: var(--ink); color: var(--primary); box-shadow: 0 12px 30px rgba(0,0,0,.22); }
  .cta:empty { display: none; }
  .footer { font-size: 26px; font-weight: 500; opacity: .8; margin-left: auto; }
</style>
</head>
<body>
  <div class="mark">&ldquo;</div>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="logo"><span>U</span></div>
        <div class="brand-name">Upgrowth</div>
      </div>
      <div class="handle">@upgrowth.io</div>
    </div>
    <div class="middle">
      <h1 class="headline">The best SEO report is a revenue number the client already understands</h1>
      <div class="rule"></div>
      <p class="body">Heard from an agency owner during our calculator research</p>
    </div>
    <div class="bottom">
      <div class="cta"></div>
      <div class="footer">upgrowth.io</div>
    </div>
  </div>
</body>
</html>
