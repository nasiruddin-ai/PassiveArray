<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>carousel slide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0F172A;
    --secondary: #1E3A8A;
    --accent: #38BDF8;
    --ink: #FFFFFF;
    --font: Inter, "Inter", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink);
    background: linear-gradient(150deg, var(--primary) 0%, var(--secondary) 100%);
    position: relative;
  }

  /* Inner carousel slide. The cover slide uses announcement.html with the "Swipe" eyebrow.
     This slide shows one point, a large step number, and a progress row so the reader knows where they are. */
  .num {
    position: absolute; right: 56px; top: 120px;
    font-size: 520px; line-height: 1; font-weight: 800; letter-spacing: -.06em;
    color: var(--accent); opacity: .16;
  }

  .card { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .logo span { font-weight: 800; font-size: 30px; color: var(--primary); }
  .brand-name { font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
  .handle { font-weight: 500; font-size: 26px; opacity: .8; }

  .middle { display: flex; flex-direction: column; gap: 28px; }
  .step {
    align-self: flex-start; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--primary); background: var(--accent); padding: 12px 22px; border-radius: 999px;
  }
  .headline {
    font-size: 80px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; max-width: 860px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    max-height: 262px; text-wrap: balance;
  }

  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 12px; align-items: center; }
  .dots i { display: block; width: 14px; height: 14px; border-radius: 7px; background: var(--ink); opacity: .3; }
  .dots i.on { width: 44px; opacity: 1; background: var(--accent); }
  .footer { font-size: 26px; font-weight: 500; opacity: .8; }
</style>
</head>
<body>
  <div class="num">6</div>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="logo"><span>U</span></div>
        <div class="brand-name">Upgrowth</div>
      </div>
      <div class="handle">@upgrowth.io</div>
    </div>
    <div class="middle">
      <div class="step">6 of 6</div>
      <h1 class="headline">Try the free calculator at upgrowth.io/tools/seo-roi</h1>
    </div>
    <div class="bottom">
      <div class="dots"><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
      <div class="footer">upgrowth.io</div>
    </div>
  </div>
</body>
</html>
