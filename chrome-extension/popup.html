<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passive Array for YouTube</title>
<style>
  :root {
    --ink: #1F2A44; --teal: #2A9D8F; --deep: #1F7F73; --indigo: #5B6ABF; --mint: #8FD3C7;
    --bg: #FFFFFF; --soft: #F4F7F9; --line: #E3E8EE; --muted: #6B7280;
    --good: #1F7F73; --warn: #B7791F; --bad: #C0392B;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E8ECF3; --bg: #14192A; --soft: #1F2740; --line: #2E3854; --muted: #9AA4B8; --deep: #8FD3C7; --good: #8FD3C7; --warn: #F0C36D; --bad: #F28B82; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 420px; max-height: 600px; overflow-y: auto; font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--soft); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header img { width: 26px; height: 26px; }
  header strong { font-weight: 600; font-size: 14px; display: block; }
  header small { color: var(--muted); font-size: 11.5px; }
  header .grow { flex: 1; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #C9D1DB; border-radius: 20px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--teal); }
  .switch input:checked + span::before { transform: translateX(16px); }

  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; padding: 10px; border: 0; background: transparent; color: var(--muted); font: 600 12.5px inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--deep); border-bottom-color: var(--teal); }
  section { display: none; padding: 14px 16px 16px; }
  section.on { display: block; }

  label { display: block; font-size: 11.5px; color: var(--muted); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--mint); border-color: var(--teal); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=text] { flex: 1; }
  .btn { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--deep); font: 600 12.5px inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--deep); color: #fff; border-color: var(--deep); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 5px 9px; font-size: 11.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; color: var(--deep); font: 500 11.5px inherit; cursor: pointer; padding: 0; }
  .link:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }
  .hint.bad { color: var(--bad); }
  .hint.good { color: var(--good); }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .score { background: var(--soft); border-radius: 10px; padding: 10px; }
  .score .l { font-size: 11px; color: var(--muted); }
  .score .v { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .score .bar { height: 5px; border-radius: 5px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--indigo)); }
  .score.hero { grid-column: 1 / -1; background: linear-gradient(135deg, var(--teal), var(--indigo)); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .score.hero .l { color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: .04em; }
  .score.hero .v { font-size: 30px; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.22); color: #fff; white-space: nowrap; }
  .verdict { font-size: 12px; margin-top: 2px; opacity: .92; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .tile { background: var(--soft); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .tile .l { font-size: 10.5px; color: var(--muted); }
  .tile .v { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  h4 { margin: 14px 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font: 12px/1 inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--teal); color: var(--deep); }

  .results { display: flex; flex-direction: column; gap: 5px; }
  .res { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--soft); text-decoration: none; color: var(--ink); }
  .res:hover { outline: 1px solid var(--teal); }
  .res .rank { font-size: 11px; color: var(--muted); text-align: right; }
  .res .t { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .m { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .n { font-size: 11px; text-align: right; line-height: 1.3; }
  .res .n b { display: block; font-size: 12px; }
  .tag { display: inline-block; font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 999px; background: var(--mint); color: #0E2E29; margin-left: 4px; vertical-align: 1px; }
  .tag.warn { background: #F5D98B; color: #4A3500; }

  .actions { display: flex; gap: 6px; margin-top: 12px; }
  .actions .btn { flex: 1; }
  .out { margin-top: 12px; }
  .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; font-size: 12.5px; }
  .list { display: flex; flex-direction: column; gap: 5px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; background: var(--soft); }
  .item .txt { flex: 1; font-size: 12.5px; }
  .item .len { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .item .len.bad { color: var(--bad); }
  pre { margin: 0; padding: 10px; border-radius: 8px; background: var(--soft); font: 12px/1.5 inherit; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
  footer { padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  footer a { color: var(--deep); text-decoration: none; font-weight: 500; }
  footer a:hover { text-decoration: underline; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <img src="icons/mark.svg" alt="">
    <div class="grow"><strong>Passive Array</strong><small>for YouTube · v1.0</small></div>
    <label class="switch" title="Show panels on YouTube pages"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <nav>
    <button data-tab="keywords" class="on">Keywords</button>
    <button data-tab="writer">AI writer</button>
  </nav>

  <section id="tab-keywords" class="on">
    <label for="kw">Keyword or topic</label>
    <div class="row">
      <input type="text" id="kw" placeholder="e.g. squarespace seo" autocomplete="off">
      <button class="btn primary" id="analyze">Analyze</button>
    </div>
    <p class="hint" id="kw-hint">Scores come from the top 20 results, not real search volume.</p>
    <div id="kw-out"></div>
  </section>

  <section id="tab-writer">
    <label for="topic">Video topic or main keyword</label>
    <input type="text" id="topic" placeholder="e.g. squarespace seo for beginners" autocomplete="off">
    <label for="notes">What the video covers (optional, used for the description)</label>
    <textarea id="notes" placeholder="3 to 5 bullet points, in your own words"></textarea>
    <label for="related">Related keywords (optional, comma separated)</label>
    <input type="text" id="related" placeholder="filled in from the keyword tool" autocomplete="off">
    <div class="actions">
      <button class="btn primary" data-gen="yt_titles">Titles</button>
      <button class="btn primary" data-gen="yt_description">Description</button>
      <button class="btn primary" data-gen="yt_tags">Tags</button>
    </div>
    <p class="hint" id="ai-hint"></p>
    <div id="ai-out"></div>
  </section>

  <footer>
    <span id="page-note"></span>
    <a href="https://passivearray.vercel.app/creator-tools/" target="_blank" rel="noopener">More creator tools</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
