<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
{{head}}
<link rel="preload" href="/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}creator-tools/shared.css">
<script>try{var t=localStorage.getItem("pa-theme-v2");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body data-root="{{root}}">{{gtmbody}}
{{header}}
<main class="wrap tp">
  <div class="tp-head">
    <div class="crumbs"><a href="{{root}}">Home</a> / <a href="{{root}}creator-tools/">All tools</a> / <a href="{{root}}creator-tools/#{{platformSlug}}">{{platform}}</a></div>
    <div class="tp-title"><h1>{{name}}</h1><span class="tp-meta">{{meta}}</span></div>
    <p class="tp-lead">{{short}}</p>
  </div>

  <section class="wb{{wbClass}}" id="wb">
    <div class="wb-in">
      <form id="form" novalidate>
        {{form}}
        <div class="actions">
          <button type="submit" class="btn" id="go">{{button}}</button>
          <button type="button" class="btn ghost" id="reset">Clear</button>
          <span class="status" id="status"></span>
        </div>
      </form>
      <p class="wb-priv">{{privacy}}</p>
    </div>
    <div class="wb-out" id="stage" aria-live="polite">{{stage}}</div>
  </section>

  <div class="results" id="results"></div>

  {{convBanner}}

  <section class="tp-how">
    <div class="tp-how-main">
      <h2>{{howTitle}}</h2>
      <p>{{intro}}</p>
    </div>
    <ol>{{how}}</ol>
  </section>

  <section class="tp-next">
    <h2>Next step</h2>
    <div class="tp-next-grid">{{next}}</div>
    <div class="siblings"><span>Related:</span>{{siblings}}</div>
  </section>
  {{guide}}
</main>
{{footer}}
<script>window.TOOL = {{tooljson}};</script>
<script defer src="{{root}}creator-tools/site.js"></script>
<script defer src="{{root}}creator-tools/shared.js"></script>
</body>
</html>
